name: Katabump Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: katabump-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: 安装测试环境
        run: |
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y xvfb xdotool fonts-noto-cjk > /dev/null 2>&1
          npm ci --no-audit --no-fund > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: 检查代码和单元测试
        timeout-minutes: 2
        run: npm run check && npm test
      - name: 浏览器回归测试
        timeout-minutes: 3
        run: npm run test:browser && npm run test:gui
